name: Software tests
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'configs/**', 'pyproject.toml', 'requirements*.txt', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'configs/**', 'pyproject.toml', 'requirements*.txt']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
